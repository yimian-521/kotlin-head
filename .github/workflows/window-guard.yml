name: Window Guard
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Probe and record
        run: |
          echo "## $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> guard_log.md
          node probe.js >> guard_log.md 2>&1 || echo "（未恢复）" >> guard_log.md
          tail -2 guard_log.md >> $GITHUB_STEP_SUMMARY
      - name: Commit log
        run: |
          git config user.email "guard@bot.local"
          git config user.name "WindowGuard"
          git add guard_log.md
          git commit -m "guard: $(date -u +%H:%M)" || echo "无变化"
          git push origin main || echo "push失败"